name: Multi Ship Windows
on:
  workflow_dispatch:
  push:
    branches: [multi-ship-build]
    paths: ['.github/workflows/multi-ship.yml', 'multiship/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the 1.21.1 sources and apply Multi Ship
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $upstream = 'https://github.com/GabrieleGiuseppini/Floating-Sandbox.git'
          $tag = git ls-remote --tags --refs $upstream | ForEach-Object { ($_ -split 'refs/tags/')[1] } |
            Where-Object { $_ -match '^(?:v|Floating-Sandbox[-_])?1[._]21[._]1$' } | Select-Object -First 1
          if (!$tag) { throw 'Upstream tag for Floating Sandbox 1.21.1 was not found.' }
          git -c core.autocrlf=false clone --depth 1 --branch $tag $upstream game
          [IO.File]::WriteAllBytes("$PWD/mod.patch", [Convert]::FromBase64String(''))
          git -C game apply --check "$PWD/mod.patch"
          git -C game apply "$PWD/mod.patch"
      - name: Integrate and test ship collisions
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python multiship/apply_contacts.py
          cmake -S multiship -B contact-tests -A x64
          cmake --build contact-tests --config Release
          & ./contact-tests/Release/ShipContactChecks.exe
      - uses: actions/cache@v4
        id: wx-cache
        with:
          path: wxsdk
          key: wx-3.1.4-msvc2022-static-sys-r2
      - uses: actions/cache/restore@v4
        id: codecs
        with:
          path: C:/vcpkg/installed/x64-windows-static
          key: multiship-win2022-codecs-v1
      - name: Install libraries
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:VCPKG_DISABLE_METRICS='1'
          if ('${{ steps.codecs.outputs.cache-hit }}' -ne 'true') { & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static libpng:x64-windows-static libjpeg-turbo:x64-windows-static --classic }
          git clone --depth 1 --branch v1.3.0 https://github.com/kazuho/picojson pico
          git clone --depth 1 --branch release-1.11.0 https://github.com/google/googletest gtest
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch v3.1.4 https://github.com/wxWidgets/wxWidgets wx
          Invoke-WebRequest https://github.com/SFML/SFML/releases/download/2.5.1/SFML-2.5.1-windows-vc15-64-bit.zip -OutFile sfml.zip
          Expand-Archive sfml.zip
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static"
          if ('${{ steps.wx-cache.outputs.cache-hit }}' -eq 'true') { exit 0 }
          $zlib = Get-ChildItem "$prefix/lib" -Filter '*.lib' | Where-Object { $_.BaseName -match '^z($|lib|s$)' } | Select-Object -First 1
          $png = Get-ChildItem "$prefix/lib" -Filter '*png*.lib' | Select-Object -First 1
          if (!$zlib -or !$png) { Get-ChildItem "$prefix/lib"; throw 'Image library lookup failed' }
          $imageArgs = @("-DZLIB_LIBRARY=$($zlib.FullName.Replace('\','/'))", "-DZLIB_LIBRARY_RELEASE=$($zlib.FullName.Replace('\','/'))", "-DPNG_LIBRARY=$($png.FullName.Replace('\','/'))", "-DPNG_LIBRARY_RELEASE=$($png.FullName.Replace('\','/'))", "-DPNG_PNG_INCLUDE_DIR=$prefix/include")
          cmake @imageArgs -S wx -B wxbuild -A x64 -G 'Visual Studio 17 2022' "-DCMAKE_PREFIX_PATH=$prefix" "-DCMAKE_INSTALL_PREFIX=$PWD/wxsdk" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DwxBUILD_SHARED=OFF -DwxBUILD_USE_STATIC_RUNTIME=ON -DwxUSE_LIBJPEG=sys -DwxUSE_LIBPNG=sys -DwxUSE_ZLIB=sys -DwxUSE_LIBTIFF=OFF -DwxUSE_EXPAT=OFF -DwxUSE_GIF=OFF -DwxUSE_LIBLZMA=OFF -DwxBUILD_SAMPLES=OFF -DwxBUILD_TESTS=OFF
          cmake --build wxbuild --config Release --target INSTALL --parallel 3
      - name: Preserve the compiled SDK
        if: steps.wx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wxsdk
          key: wx-3.1.4-msvc2022-static-sys-r2
      - uses: actions/cache/save@v4
        if: steps.codecs.outputs.cache-hit != 'true'
        with:
          path: C:/vcpkg/installed/x64-windows-static
          key: multiship-win2022-codecs-v1
      - name: Build game with the mod
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sfml = (Get-ChildItem sfml -Recurse -Filter SFMLConfig.cmake | Select-Object -First 1).Directory.FullName
          $wxLib = (Get-ChildItem wxsdk -Recurse -Filter wxbase31u.lib | Select-Object -First 1).Directory.FullName
          if (!$sfml -or !$wxLib) { throw 'Required SDK folders were not found.' }
          "macro(DefineUserPostInstall)`nendmacro()" | Set-Content game/UserSettings.cmake
          $file = (Resolve-Path game/CMakeLists.txt).Path
          $cm = [IO.File]::ReadAllText($file).Replace('COMPONENTS system audio REQUIRED','COMPONENTS system audio network REQUIRED').Replace(' /WX"', ' /WX-"')
          [IO.File]::WriteAllText($file,$cm)
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static"
          $zlib = Get-ChildItem "$prefix/lib" -Filter '*.lib' | Where-Object { $_.BaseName -match '^z($|lib|s$)' } | Select-Object -First 1
          $png = Get-ChildItem "$prefix/lib" -Filter '*png*.lib' | Select-Object -First 1
          if (!$zlib -or !$png) { Get-ChildItem "$prefix/lib"; throw 'Image library lookup failed' }
          $imageArgs = @("-DZLIB_LIBRARY=$($zlib.FullName.Replace('\','/'))", "-DZLIB_LIBRARY_RELEASE=$($zlib.FullName.Replace('\','/'))", "-DPNG_LIBRARY=$($png.FullName.Replace('\','/'))", "-DPNG_LIBRARY_RELEASE=$($png.FullName.Replace('\','/'))", "-DPNG_PNG_INCLUDE_DIR=$prefix/include")
          cmake @imageArgs -S game -B build -A x64 -G 'Visual Studio 17 2022' "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DFS_BUILD_BENCHMARKS=OFF -DFS_USE_STATIC_LIBS=ON "-DCMAKE_PREFIX_PATH=$prefix" "-DGTEST_DIR:PATH=$PWD/gtest" "-DPICOJSON_DIR:PATH=$PWD/pico" "-DSFML_DIR=$sfml" "-DSFML_BIN_DIR:PATH=$sfml/../../../bin" "-DwxWidgets_ROOT:PATH=$PWD/wxsdk" "-DwxWidgets_LIB_DIR:PATH=$wxLib" -DwxWidgets_CONFIGURATION=mswu -DwxWidgets_USE_REL_AND_DBG=OFF
          cmake --build build --target FloatingSandbox --config Release --parallel 2
          cmake --install build/Sources/FloatingSandbox --config Release --prefix "$PWD/package"
          foreach ($item in 'FloatingSandbox.exe','sfml-audio-2.dll','openal32.dll','Data','Ships/default_ship.shp2') {
            if (!(Test-Path "package/$item")) { throw "Missing from game package: $item" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingSandbox-MultiShip-Collisions-Windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 7
